name: AsooGak Distributed Catalogue & Episode Scanner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      duration_ms:
        description: 'Scan duration per parallel shard (milliseconds)'
        required: false
        default: '1200000'

permissions:
  contents: write
  issues: write

concurrency:
  group: asoogak-catalogue-scanner
  cancel-in-progress: false

env:
  EXISTING_CATALOGUE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/catalogue-data/catalogue.json
  STATE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/catalogue-data/scanner-state.json
  SCAN_DURATION_MS: ${{ github.event.inputs.duration_ms || '1200000' }}

jobs:
  # Sizes this run from measured demand vs capacity (plan.mjs): shard count auto-scales 16-20 and, beyond that,
  # the long tail is re-checked less often instead of silently falling behind.
  plan:
    name: Capacity Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      recheck_age_ms: ${{ steps.plan.outputs.recheck_age_ms }}
      recheck_age_tail_ms: ${{ steps.plan.outputs.recheck_age_tail_ms }}
      popular_min: ${{ steps.plan.outputs.popular_min }}
      plan_json: ${{ steps.dump.outputs.plan_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          # The verified-feed repo shares this account's ~20 runner slots and owns day-to-day freshness (cheap proofs every 4-24h),
          # so this scanner runs fewer shards, re-proves deeply every ~48h (retention is 3 days) and spends the rest on discovery.
          MIN_SHARDS: ${{ vars.SCANNER_SHARDS || '10' }}
          MAX_SHARDS: ${{ vars.SCANNER_SHARDS || '10' }}
          FAST_AGE_MS: ${{ vars.SCANNER_RECHECK_MS || '86400000' }}
        run: node plan.mjs
      - id: dump
        run: echo "plan_json=$(cat plan.json)" >> "$GITHUB_OUTPUT"

  scan-shards:
    name: Scan Shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Multi-IP Shard Verification & Discovery
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.plan.outputs.shards }}
          RECHECK_AGE_MS: ${{ needs.plan.outputs.recheck_age_ms }}
          RECHECK_AGE_TAIL_MS: ${{ needs.plan.outputs.recheck_age_tail_ms }}
          POPULAR_MIN: ${{ needs.plan.outputs.popular_min }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          RESOLVER_KEY: ${{ secrets.RESOLVER_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          HOT_AGE_MS: ${{ vars.SCANNER_HOT_MS || '28800000' }}
        run: node scan-shard.mjs

      - name: Upload Shard Output
        uses: actions/upload-artifact@v4
        with:
          name: shard-output-${{ matrix.shard }}
          path: shard-output-${{ matrix.shard }}.json
          retention-days: 1

  merge-and-publish:
    name: Merge Shards & Publish CDN Snapshot
    needs: [plan, scan-shards]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scanner
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A flaky artifact download used to throw away a whole run (16 shards x 20 min of verified work) because the merge
      # job never retried. Try the standard action once, then fall back to the CLI with backoff.
      - name: Download All Shard Artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Retry Shard Artifact Download
        if: steps.download.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf artifacts
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts; then
              echo "Downloaded on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "Artifact download failed after 5 attempts" >&2
          exit 1

      - name: Merge Shards with Cloudflare & Existing Catalogue
        env:
          ARTIFACTS_DIR: artifacts
          OUTPUT_DIR: dist
          AVAILABILITY_API: ${{ secrets.AVAILABILITY_API }}
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
        run: node merge-catalogue.mjs

      - name: Publish Catalogue Snapshot to catalogue-data Branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b catalogue-data
          git add catalogue.json scanner-state.json
          git commit -m "Update verified catalogue snapshot ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalogue-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Watchdog: opens (or updates) one issue when re-verification falls behind or capacity runs out - GitHub emails
      # the repo owner - and closes it automatically once the scanner has caught up again.
      - name: Catch-up Watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_HOT_P95H: '60'
          WATCHDOG_P95H: '80'
        run: node watchdog.mjs dist/scanner-state.json
